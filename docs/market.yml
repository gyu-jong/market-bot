name: market-report

on:
  # ── 주 실행 방식: 외부 타이머(cron-job.org)가 GitHub API로 이 워크플로우를 호출 ──
  workflow_dispatch:
    inputs:
      targets:
        description: "대상 (예: ABCDE). AUTO면 슬롯 기본 대상(0700/0900=ABE, 나머지=CD)"
        default: "ABCDE"
      slot:
        description: "슬롯 (예: 0700)"
        default: "0700"
      wait:
        description: "true면 슬롯 시각(KST)까지 기다렸다가 발송, false면 즉시 발송(수동 테스트)"
        default: "false"

  # ── 백업용(기본 비활성): 외부 타이머와 동시에 켜면 메시지가 중복 발송됩니다 ──
  # schedule:
  #   - cron: "35 21 * * 0-5"
  #   - cron: "47 22 * * 0-4"
  #   - cron: "37 23 * * 0-4"
  #   - cron: "35 23 * * 0-4"
  #   - cron: "47 0 * * 1-5"
  #   - cron: "17 3 * * 1-5"
  #   - cron: "47 4 * * 1-5"

permissions:
  contents: write

# 같은 슬롯이 겹쳐 호출돼도 순서대로 처리(서로 다른 슬롯은 동시에 실행)
concurrency:
  group: market-${{ github.event.schedule || inputs.slot || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150     # 일찍 호출 → 수집 직전까지 대기하므로 여유 있게
    env:
      TRIGGER_LEAD_MIN: "60"      # cron-job.org 호출 시각 = 발송시각 - 60분 (README 표 참고)
      MAX_BUDGET_SEC: "1500"      # 수집 시간 상한(초). 넘으면 해당 대상은 생략하고 정시 발송
      HTTP_TIMEOUT_SEC: "30"      # 응답 없는 외부 서버 대기 상한
      SCHEDULE: ${{ github.event.schedule }}
      IN_TARGETS: ${{ inputs.targets }}
      IN_SLOT: ${{ inputs.slot }}
      WAIT_FOR_SLOT: ${{ inputs.wait }}
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
    steps:
      - name: Fired (로그 확인용)
        run: |
          echo "event=${{ github.event_name }} slot='$IN_SLOT' targets='$IN_TARGETS' wait='$WAIT_FOR_SLOT'"
          echo "UTC $(date -u '+%F %T')  /  KST $(TZ=Asia/Seoul date '+%F %T')"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Korean font
        timeout-minutes: 5
        run: |
          sudo timeout 120 apt-get update -y || true
          sudo timeout 180 apt-get install -y fonts-nanum || true
      - run: pip install -r requirements.txt

      # 1) 데이터 수집·리포트 생성 (발송 안 함)
      - name: Build
        timeout-minutes: 100
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python market_bot.py --build-only --targets "$IN_TARGETS" --slot "$IN_SLOT"
          else
            python market_bot.py --build-only
          fi

      # 2) 리포트 게시(커밋·푸시). 발송 전에 올려서 링크가 열리도록 함
      - name: Publish reports
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add docs data || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "report $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "push 재시도 $i"; sleep $((i*5))
          done

      # 3) wait=true 이면 슬롯 시각(KST)까지 대기 후 발송, 아니면 즉시 발송
      - name: Send Kakao
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$WAIT_FOR_SLOT" != "true" ]; then
            python market_bot.py --send-only --no-wait --slot "$IN_SLOT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python market_bot.py --send-only --slot "$IN_SLOT"
          else
            python market_bot.py --send-only
          fi
